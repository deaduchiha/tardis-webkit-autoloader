<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tardis WebKit Autoloader</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0; padding: 32px 20px; display: flex; align-items: center;
      justify-content: center; background: #090a18; color: #f5f5ff;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
    }
    main { width: 100%; max-width: 760px; }
    .mark { width: 68px; height: 68px; margin-bottom: 18px; }
    h1 { margin: 0 0 12px; font-size: clamp(26px, 5vw, 38px); letter-spacing: .08em; text-transform: uppercase; }
    p { color: #a8abc7; line-height: 1.55; font-size: 17px; }
    #firmware { color: #aaa6ff; }
    .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 28px; }
    .choice {
      display: block; padding: 24px; border: 1px solid rgba(156,153,255,.28);
      border-radius: 16px; background: #11122b; color: #f5f5ff; text-decoration: none;
      text-align: left; transition: border-color .15s, transform .15s, background .15s;
    }
    .choice:focus, .choice:hover { outline: none; border-color: #aaa6ff; background: #191a3b; transform: translateY(-2px); }
    .choice[aria-disabled="true"] { opacity: .45; pointer-events: none; }
    .choice strong { display: block; margin-bottom: 8px; color: #aaa6ff; font-size: 24px; }
    .choice span { color: #d1ceff; font-size: 14px; }
    .choice p { margin-bottom: 0; font-size: 15px; }
    #message { min-height: 26px; }
    @media (max-width: 560px) { .choices { grid-template-columns: 1fr; } body { align-items: flex-start; } }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 64 64" role="img" aria-label="Tardis" xmlns="http://www.w3.org/2000/svg">
      <path fill="#817bff" d="M11 8h16v48H11zM37 8h16v48H37z"/>
      <path fill="#aaa6ff" d="M5 5h28v7H5zM31 5h28v7H31zM5 52h28v7H5zM31 52h28v7H31z"/>
      <path fill="#d1ceff" d="M19 18h2v4h-2zm0 8h2v4h-2zm0 8h2v4h-2zm0 8h2v4h-2zm18-24h2v4h-2zm0 8h2v4h-2zm0 8h2v4h-2zm0 8h2v4h-2z"/>
    </svg>
    <h1>Tardis WebKit Autoloader</h1>
    <p id="firmware">Choose an exploit to continue.</p>
    <div class="choices">
      <a class="choice" id="poops" href="?exploit=poops">
        <strong>Poops</strong><span>Firmware 7.00–12.00</span>
        <p>Works offline and does not need an active network interface.</p>
      </a>
      <a class="choice" id="relapse" href="?exploit=relapse">
        <strong>Relapse</strong><span>Firmware 7.00–13.60, except 9.05</span>
        <p>Needs Wi-Fi or Ethernet connected. Internet access is not required.</p>
      </a>
    </div>
    <p id="message" aria-live="polite"></p>
  </main>
  <script>
    (function () {
      var match = /PlayStation 5\/(\d+\.\d+)/.exec(navigator.userAgent);
      var firmware = match ? parseFloat(match[1]) : null;
      var poops = document.getElementById('poops');
      var relapse = document.getElementById('relapse');
      var label = document.getElementById('firmware');
      var message = document.getElementById('message');
      if (firmware === null) {
        label.textContent = 'Select a chain. On a PS5, choices are limited to supported firmware.';
        return;
      }
      label.textContent = 'Detected PS5 firmware ' + match[1] + '. Choose a supported exploit.';
      var supportsPoops = firmware >= 7 && firmware <= 12;
      var supportsRelapse = firmware >= 7 && firmware <= 13.60 && firmware !== 9.05;
      if (!supportsPoops) {
        poops.setAttribute('aria-disabled', 'true');
        poops.removeAttribute('href');
      }
      if (!supportsRelapse) {
        relapse.setAttribute('aria-disabled', 'true');
        relapse.removeAttribute('href');
      }
      if (!supportsPoops && !supportsRelapse) {
        message.textContent = 'This firmware is outside the supported range (7.00–13.60).';
      } else if (supportsPoops !== supportsRelapse) {
        message.textContent = 'Only the supported exploit is available for this firmware.';
      }
    }());
  </script>
</body>
</html>
